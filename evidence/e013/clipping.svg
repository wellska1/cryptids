<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1400" viewBox="0 0 1000 1400">
  <rect width="100%" height="100%" fill="#f4f1e8"/>
  <rect x="30" y="30" width="940" height="1340" fill="none" stroke="#1e1e1e" stroke-width="2"/>
  <text x="500" y="70" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="20" fill="#333">CRYPTID GAZETTE ARCHIVE</text>
  <text x="70" y="90" font-family="Georgia,Times New Roman,serif" font-size="48" font-weight="700" fill="#111">Akron Beacon Journal: Minerva monster</text>
  <text x="70" y="142" font-family="Georgia,Times New Roman,serif" font-size="48" font-weight="700" fill="#111">(1980)</text>
  <text x="70" y="206" font-family="Arial,sans-serif" font-size="20" fill="#444">Newspaper | 1980-06-29 | ID E013</text>
  <line x1="70" y1="242" x2="930" y2="242" stroke="#777" stroke-width="1"/>
  <text x="70" y="282" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">SUMMARY</text>
  <text x="70" y="316" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#1d1d1d">Digitized compilation reproduces a 1980 newspaper report about the Cayton family and</text>
  <text x="70" y="350" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#1d1d1d">alleged encounters.</text>
  <text x="70" y="404" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">CITATION</text>
  <text x="70" y="438" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#1d1d1d">Barbara Mudrak, “Minerva’s ‘monster’ is ‘almost like a pet’,” Akron Beacon Journal,</text>
  <text x="70" y="470" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#1d1d1d">June 29, 1980. Reproduced</text>
  <line x1="70" y1="1305" x2="930" y2="1305" stroke="#777" stroke-width="1"/>
  <text x="70" y="1340" font-family="Consolas,Monaco,monospace" font-size="16" fill="#333">https://projectaquarius.mufon.com/wp-content/uploads/NewsClippings/UFO-Newsclipping-Service/UFO-Newsclipping-Service-1980-07-no-132.pdf</text>
</svg>
