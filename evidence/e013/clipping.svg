  <text x="70" y="115" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#111">Akron Beacon Journal: Minerva</text>
  <text x="70" y="165" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#111">monster (1980)</text>
  <text x="70" y="223" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="400" fill="#111">Newspaper | 1980-06-29</text>
  <text x="70" y="270" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" fill="#111">Summary</text>
  <text x="70" y="304" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" fill="#111">Digitized compilation reproduces a 1980 newspaper report about</text>
  <text x="70" y="334" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" fill="#111">the Cayton family and alleged encounters.</text>
  <text x="70" y="382" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" fill="#111">Citation</text>
  <text x="70" y="416" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="400" fill="#111">Barbara Mudrak, “Minerva’s ‘monster’ is ‘almost like a pet’,” Akron</text>
  <text x="70" y="443" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="400" fill="#111">Beacon Journal, June 29, 1980. Reproduced in UFO Newsclipping Service,</text>
  <text x="70" y="470" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="400" fill="#111">no. 132 (July 1980).</text>
