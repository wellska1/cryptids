  <text x="500" y="70" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="20" fill="#333">CRYPTID GAZETTE ARCHIVE</text>
  <text x="70" y="90" font-family="Georgia,Times New Roman,serif" font-size="48" font-weight="700" fill="#111">Ohio newspaper sea-serpent reprint (July</text>
  <text x="70" y="142" font-family="Georgia,Times New Roman,serif" font-size="48" font-weight="700" fill="#111">21)</text>
  <text x="70" y="206" font-family="Arial,sans-serif" font-size="20" fill="#444">Newspaper | 1892-07-21 | ID E016</text>
  <line x1="70" y1="242" x2="930" y2="242" stroke="#777" stroke-width="1"/>
  <text x="70" y="282" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">SUMMARY</text>
  <text x="70" y="316" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#1d1d1d">Democratic Northwest includes the sea-serpent item titled &quot;A Marine Monster,&quot;</text>
  <text x="70" y="350" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#1d1d1d">describing a Lake Erie schooner report.</text>
  <text x="70" y="404" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">CITATION</text>
  <text x="70" y="438" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#1d1d1d">Democratic Northwest (Napoleon, Ohio), July 21, 1892, &quot;A Marine Monster,&quot; Library of</text>
  <text x="70" y="470" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#1d1d1d">Congress digitized issue.</text>
