  <text x="70" y="115" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#111">Ohio newspaper sea-serpent reprint</text>
  <text x="70" y="165" font-family="Georgia, Times New Roman, serif" font-size="42" font-weight="700" fill="#111">(July 21)</text>
  <text x="70" y="223" font-family="Georgia, Times New Roman, serif" font-size="20" font-weight="400" fill="#111">Newspaper | 1892-07-21</text>
  <text x="70" y="270" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" fill="#111">Summary</text>
  <text x="70" y="304" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" fill="#111">Democratic Northwest includes the sea-serpent item titled "A</text>
  <text x="70" y="334" font-family="Georgia, Times New Roman, serif" font-size="21" font-weight="400" fill="#111">Marine Monster," describing a Lake Erie schooner report.</text>
  <text x="70" y="382" font-family="Georgia, Times New Roman, serif" font-size="22" font-weight="700" fill="#111">Citation</text>
  <text x="70" y="416" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="400" fill="#111">Democratic Northwest (Napoleon, Ohio), July 21, 1892, "A Marine</text>
  <text x="70" y="443" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="400" fill="#111">Monster," Library of Congress digitized issue.</text>
