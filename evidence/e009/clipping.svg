  <text x="500" y="70" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="20" fill="#333">CRYPTID GAZETTE ARCHIVE</text>
  <text x="70" y="90" font-family="Georgia,Times New Roman,serif" font-size="48" font-weight="700" fill="#111">Gallipolis Wild Man newspaper reprints</text>
  <text x="70" y="154" font-family="Arial,sans-serif" font-size="20" fill="#444">Newspaper | 1869 | ID E009</text>
  <line x1="70" y1="190" x2="930" y2="190" stroke="#777" stroke-width="1"/>
  <text x="70" y="230" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">SUMMARY</text>
  <text x="70" y="264" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#1d1d1d">Nineteenth-century reprints indicate circulation of the story; original reporting</text>
  <text x="70" y="298" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#1d1d1d">requires comparison.</text>
  <text x="70" y="352" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#111">CITATION</text>
  <text x="70" y="386" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#1d1d1d">The Cambria Freeman, January 28, 1869, reported page 1.</text>
  <line x1="70" y1="1305" x2="930" y2="1305" stroke="#777" stroke-width="1"/>
  <text x="70" y="1340" font-family="Consolas,Monaco,monospace" font-size="16" fill="#333">https://www.loc.gov/resource/sn83032041/1869-01-28/ed-1/</text>
